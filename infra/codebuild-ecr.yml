AWSTemplateFormatVersion: "2010-09-09"
Description: CodeBuild project and private ECR repository for the FastAPI backend image.

Parameters:
  ProjectName:
    Type: String
    Default: crud-backend-image
    Description: CodeBuild project name.
  GitHubRepositoryUrl:
    Type: String
    Default: https://github.com/mert-kurttutan/crud-playground
    Description: Public GitHub repository URL used as the build source.
  SourceVersion:
    Type: String
    Default: main
    Description: Git branch, tag, or commit to build.
  ImageRepositoryName:
    Type: String
    Default: crud/fastapi
    Description: Private ECR repository name.

Resources:
  BackendImageRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref ImageRepositoryName
      ImageScanningConfiguration:
        ScanOnPush: true

  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-service-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: codebuild-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${ProjectName}"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${ProjectName}:*"
        - PolicyName: codebuild-ecr-push
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:BatchGetImage
                  - ecr:DescribeRepositories
                Resource: !GetAtt BackendImageRepository.Arn

  BackendImageBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Ref ProjectName
      Description: Build and push the FastAPI backend image to private ECR.
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Source:
        Type: GITHUB
        Location: !Ref GitHubRepositoryUrl
        GitCloneDepth: 1
        BuildSpec: |
          version: 0.2

          phases:
            pre_build:
              commands:
                - echo Logging in to Amazon ECR...
                - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY_URI"
                - COMMIT_SHA="${CODEBUILD_RESOLVED_SOURCE_VERSION:-manual}"
                - IMAGE_TAG="$COMMIT_SHA"
                - if [ "$IMAGE_TAG" = "manual" ]; then IMAGE_TAG="manual-$(date +%Y%m%d%H%M%S)"; fi
                - IMAGE_URI="$ECR_REPOSITORY_URI:$IMAGE_TAG"
                - echo "Image tag is $IMAGE_TAG"
            build:
              commands:
                - echo Build started on `date`
                - echo Building the Docker image...
                - docker build --platform linux/amd64 -t "$IMAGE_REPO_NAME:$IMAGE_TAG" ./backend
                - docker tag "$IMAGE_REPO_NAME:$IMAGE_TAG" "$IMAGE_URI"
            post_build:
              commands:
                - echo Build completed on `date`
                - echo Pushing the Docker image...
                - docker push "$IMAGE_URI"
                - echo "Pushed $IMAGE_URI"
      SourceVersion: !Ref SourceVersion
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-x86_64-standard:6.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: AWS_DEFAULT_REGION
            Type: PLAINTEXT
            Value: !Ref AWS::Region
          - Name: ECR_REGISTRY_URI
            Type: PLAINTEXT
            Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com"
          - Name: ECR_REPOSITORY_URI
            Type: PLAINTEXT
            Value: !GetAtt BackendImageRepository.RepositoryUri
          - Name: IMAGE_REPO_NAME
            Type: PLAINTEXT
            Value: !Ref ImageRepositoryName
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub "/aws/codebuild/${ProjectName}"

Outputs:
  CodeBuildProjectName:
    Description: CodeBuild project that builds and pushes the backend image.
    Value: !Ref BackendImageBuildProject
  EcrRepositoryUri:
    Description: Private ECR repository URI used by the build.
    Value: !GetAtt BackendImageRepository.RepositoryUri
  ImageUri:
    Description: Image URI prefix. Builds append a Git commit tag.
    Value: !Sub "${BackendImageRepository.RepositoryUri}:<git-commit-sha>"
